name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      # No gradle-wrapper.jar in this repo: use the Gradle distribution directly.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Decode release keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
      - name: Build release APK
        env:
          KEYSTORE_FILE: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          name: 微信通知进化 ${{ github.ref_name }}
          body: |
            微信通知进化正式签名版。

            功能：
            - 微信通知进化为 MessagingStyle 会话样式（Android 17 上可用，替代失效的 Nevolution）
            - 汇总通知按组未读满 100 条才出现，不满只显示各会话自己的通知
            - Android 11+ 会话优先级：进化版通知以系统会话发布，长按通知可按会话调优先 / 默认 / 静音
            - 通知头像右下角角标默认使用微信启动器图标（绿色 logo），也可在应用内切回微信原始通知小图标
            - 会话通知支持系统消息气泡（女娲石同款快捷方式气泡）：点气泡直接进微信对应聊天；需在系统设置里允许本应用显示气泡
            - 气泡重做：不再走中转 Activity 转发（中转的第二跳会被系统无声拦住、黑屏、切换崩溃），改按女娲石做法——学到会话微信号后快捷方式直指微信聊天页，气泡直接引用快捷方式；学不到微信号时回落微信主界面

            已知限制：
            - 直接回复与标为已读依赖微信在通知里提供 car-extender 数据；当前版本微信不提供，故这两项不出现，但消息进化本身不受影响
            - 群聊判定是启发式；会话归档只存在进程内存里，应用进程被杀后历史从下一条新通知重建

            安装：下载 app-release.apk 安装，授予通知使用权（Android 13+ 还需通知权限）。
            注意：本版起改用正式签名，无法直接覆盖安装 v1.0.0 的 debug 签名版，需先卸载旧版再装。
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
