name: Release

# Publishing contract: push an annotated v* tag after branch CI succeeds.
# This workflow builds with the repository's release-signing secrets and attaches
# the exact signed APK below to the matching non-draft GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      # No gradle-wrapper.jar in this repo: use the Gradle distribution directly.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"
      - name: Decode release keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
      - name: Build release APK
        env:
          KEYSTORE_FILE: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          name: 微信通知进化 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          # v1.0.20-beta.5 is intentionally a non-draft pre-release; make_latest=false keeps v1.0.19 latest.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
