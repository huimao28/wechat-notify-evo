name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      # No gradle-wrapper.jar in this repo: use the Gradle distribution directly.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Decode release keystore
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
      - name: Build release APK
        env:
          KEYSTORE_FILE: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          name: 微信通知进化 ${{ github.ref_name }}
          body: |
            微信通知进化正式签名版。

            功能：
            - 微信通知进化为 MessagingStyle 会话样式（Android 17 上可用，替代失效的 Nevolution）
            - 汇总通知按组未读满 100 条才出现，不满只显示各会话自己的通知
            - Android 11+ 会话优先级：进化版通知以系统会话发布，长按通知可按会话调优先 / 默认 / 静音
            - 通知头像右下角角标默认使用微信启动器图标（绿色 logo），也可在应用内切回微信原始通知小图标
            - 会话通知支持系统消息气泡（快捷方式气泡）：点气泡直达微信对应聊天；需在系统设置里允许本应用显示气泡
            - v1.0.12：气泡不再学微信号（Android 17 上后台发 intent 回调不触发，学习日志为空，学不到号），改由快捷方式中转页转发微信原通知 intent 直达对应聊天；聊天可能以全屏打开而非悬浮窗口内，因为微信聊天界面只能由微信自己显示
            - v1.0.13：中转 intent 不再带微信 PendingIntent（快捷方式持久化不支持该类型，可能导致快捷方式建不出来、气泡消失），只传会话 id，中转页按 id 查最新 intent
            - v1.0.14：修气泡消失——中转 intent 没设 action，系统建快捷方式时抛 NullPointerException（日志实证），现设为 ACTION_VIEW；多发送者的群消息微信本身不给头像时，保留上一次的头像而不是回落应用图标
            - v1.0.15：中转页改成不透明加载界面（透明窗口可能不被算作前台、转发会被系统拦，黑屏也无法区分原因）；转发失败统一弹提示并退出
            - v1.0.16：中转转发改由恢复与获焦双触发（并等 300ms 让前台状态落稳），全屏打开导致失焦时静默退出，不再误报失败

            已知限制：
            - 直接回复与标为已读依赖微信在通知里提供 car-extender 数据；当前版本微信不提供，故这两项不出现，但消息进化本身不受影响
            - 群聊判定是启发式；会话归档只存在进程内存里，应用进程被杀后历史从下一条新通知重建

            安装：下载 app-release.apk 安装，授予通知使用权（Android 13+ 还需通知权限）。
            注意：本版起改用正式签名，无法直接覆盖安装 v1.0.0 的 debug 签名版，需先卸载旧版再装。
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
